<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563EB">
<title>Offline | AI Asis</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F8FAFC;color:#1E293B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:360px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:20px 0 8px}
  p{margin:0 0 24px;color:#475569;line-height:1.5}
  button{background:#2563EB;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer}
  button:active{background:#1D4ED8}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="AI Asis" width="72" height="72">
  <h1>You're offline</h1>
  <p>AI Asis needs an internet connection to load your invoices securely. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
